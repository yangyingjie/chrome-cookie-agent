<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 1. 背景底座渐变: 极简深曜翡翠微光 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01140e" />
    </linearGradient>

    <!-- 2. 外边框微光翡翠流光 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35" />
    </linearGradient>

    <!-- 3. 曲奇金色渐变: 纯粹琥珀明金 (Cookie / Token) -->
    <linearGradient id="cookieGrad" x1="20%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 柔和立体阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Squircle 外框底座 (Apple 连续曲率圆角矩形) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.4" filter="url(#softShadow)" />

  <!-- 2. 核心极简琥珀金曲奇 (带右上角标志性咬口切角) -->
  <g filter="url(#softShadow)">
    <path d="M 64,25.5 A 38.5,38.5 0 1,0 102.5,64 C 94.5,63.5 86.5,54.5 86.5,46.5 C 86.5,38.5 74.5,26 64,25.5 Z" 
          fill="url(#cookieGrad)" 
          stroke="#fef9c3" 
          stroke-width="2.2" 
          stroke-linejoin="round" />
  </g>

  <!-- 3. 曲奇左上方柔和高光微弧 -->
  <path d="M 37,45 A 32,32 0 0,1 58,33" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.65" />

  <!-- 4. 黄金比例极简巧克力芯片 (3颗规整立体芯片) -->
  <!-- 芯片 1 (左上) -->
  <circle cx="51" cy="53" r="7" fill="#3b1204" />
  <circle cx="49" cy="51" r="2.2" fill="#fde68a" opacity="0.85" />

  <!-- 芯片 2 (右下) -->
  <circle cx="71" cy="76" r="6.8" fill="#3b1204" />
  <circle cx="69.2" cy="74.2" r="2.1" fill="#fde68a" opacity="0.85" />

  <!-- 芯片 3 (左下) -->
  <circle cx="53" cy="80" r="6.2" fill="#3b1204" />
  <circle cx="51.3" cy="78.3" r="1.9" fill="#fde68a" opacity="0.85" />
</svg>
