<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143c2c" />
      <stop offset="100%" stop-color="#081812" />
    </linearGradient>

    <!-- 盾牌渐变 (WebRTC 安全与隐私防护) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 曲奇金色渐变 (Cookie 与身份令牌) -->
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- 柔和阴影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Squircle 外框与底色 -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.85" filter="url(#dropShadow)" />

  <!-- 2. 核心晶体盾牌 -->
  <path d="M 64,28 L 96,38 L 96,62 Q 96,86 64,102 Q 32,86 32,62 L 32,38 Z" fill="url(#shieldGrad)" stroke="#a7f3d0" stroke-width="2" filter="url(#dropShadow)" />

  <!-- 3. 金色科技曲奇饼 -->
  <circle cx="64" cy="58" r="19" fill="url(#cookieGrad)" stroke="#fef3c7" stroke-width="1.8" />

  <!-- 4. 巧克力芯片与科技节点 -->
  <circle cx="56" cy="49" r="3.2" fill="#78350f" />
  <circle cx="72" cy="52" r="3.5" fill="#78350f" />
  <circle cx="61" cy="61" r="3.8" fill="#78350f" />
  <circle cx="53" cy="66" r="3" fill="#78350f" />
  <circle cx="73" cy="65" r="3.2" fill="#78350f" />

  <!-- 5. 双向科技切换光环 (User-Agent 切换) -->
  <path d="M 36,46 A 34 34 0 0 1 76,26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 8" opacity="0.9" />
  <path d="M 92,82 A 34 34 0 0 1 52,102" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 8" opacity="0.9" />
</svg>
